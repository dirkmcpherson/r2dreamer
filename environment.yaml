name: rl
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # PyTorch with CUDA 12 — matches the Docker base image (cuda12.9/cudnn9)
  - pytorch=2.8.0
  - pytorch-cuda=12.9
  - torchvision
  - pip:
    - tensordict==0.9.1
    - torchrl==0.9.2
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - tensorboard==2.17.1
    - wandb
    - numpy==1.26.0
    - opencv-python==4.7.0.72
    - einops==0.3.0
    - moviepy==1.0.3
    - cloudpickle
    # RL environments
    - dm_control==1.0.28
    - mujoco==3.3.0
    - ale_py==0.11.2
    - crafter==1.8.0
    - memory_maze==1.0.3
    - metaworld==3.0.0
    - gymnasium==1.2.1
    # ManiSkill fork — install after env creation:
    #   pip install -e /path/to/ManiSkill
