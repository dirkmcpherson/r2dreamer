[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r2dreamer"
version = "0.1.0"
description = "R2-Dreamer: Redundancy-Reduced World Models for RL"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchrl>=0.9",
    "tensordict>=0.9",
    "einops>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "hydra-core>=1.3",
    "gymnasium>=1.0",
    "ruamel.yaml>=0.17",
    "moviepy>=1.0",
    "tensorboard>=2.17",
]

[tool.setuptools]
packages = ["r2dreamer"]
